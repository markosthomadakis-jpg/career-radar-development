name: Automated QA

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build and run offline QA
        run: npm run qa
      - name: Committed dist matches source
        run: git diff --exit-code -- dist
      - name: Preserve browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            test-results/
            career-radar-playwright-results/
            reports/playwright-html/
          if-no-files-found: ignore
